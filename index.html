.lid{

.lid.open{

.slice.tl:hover{transform:scale(1.06) translate(-3px,-3px)}
.slice.tr:hover{transform:scale(1.06) translate(3px,-3px)}

let AC,M,mute=false,st=0,nt=0,paused=false,volLevel=0.5;

function toggleAudioPopover(e){
  if(e) e.stopPropagation();
  ac();
  const pop = $("#volPopover");
  pop.classList.toggle("on");
}
document.addEventListener("click", e=>{
  if(!e.target.closest("#volPopover") && !e.target.closest("[data-tt='tt_aud']")) {
    $("#volPopover").classList.remove("on");
  }
});

function setVolume(v){
  volLevel = v / 100;
  $("#volVal").textContent = v + "%";
  if(M && !mute) M.gain.setTargetAtTime(volLevel, AC.currentTime, 0.05);
}
function toggleMuteBtn(){
  mute = !mute;
  if(M) M.gain.setTargetAtTime(mute ? 0 : volLevel, AC.currentTime, 0.05);
  $("#mutePopBtn").textContent = mute ? "UNMUTE" : "MUTE";
  apply();
}

function togglePause(){
  if(!G||!G.on) return;
  paused=!paused;
  $("#pauseModal").classList.toggle("on", paused);
  if(!paused) ac();
}

function ac(){
  if(!AC){
    AC=new(window.AudioContext||window.webkitAudioContext)();
    M=AC.createGain();
    M.gain.value=mute?0:volLevel;
    const f=AC.createBiquadFilter();
    f.type="lowpass";
    f.frequency.value=1800;
    M.connect(f);
    f.connect(AC.destination);
    nt=AC.currentTime+.15;
    setInterval(sch,80);
  }
  if(AC.state=="suspended")AC.resume();
}

function note(n,t0,d,ty="sine",v=.04){
  if(!AC||paused||mute)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=ty;
  o.frequency.value=440*2**(n/12);
  g.gain.setValueAtTime(.0001,t0);
  g.gain.linearRampToValueAtTime(v,t0+.03);
  g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g);
  g.connect(M);
  o.start(t0);
  o.stop(t0+d+.05);
}

const MEL=[[7,12,7],[3,7,3],[0,3,7],[12,7,3],[7,10,7],[2,7,2],[-2,2,7],[10,7,2],[5,8,12],[8,5,0],[3,7,12],[7,3,0],[2,5,10],[7,2,-2],[0,3,7],[12,null,null]];
const CH=[[-24,[-12,-5]],[-24,[-12,-5]],[-29,[-5,2]],[-24,[-12,-5]],[-19,[-7,0]],[-24,[-12,-5]],[-29,[-5,2]],[-24,[-12,-5]]];

function sch(){
  if(!AC||paused||mute)return;
  while(nt<AC.currentTime+.25){
    const bar=(st/3|0)%16, b=st%3, [r,c]=CH[bar%8], m=MEL[bar][b];
    if(b==0) note(r,nt,.45,"triangle",.05);
    else c.forEach(x=>note(x,nt,.2,"sine",.018));
    if(m!=null) note(m,nt,.25,"sine",.035);
    st++;
    nt+=.16;
  }
}

function sfx(k){
  if(!AC||paused)return;
  const t=AC.currentTime,P=[3,5,7,10,12];
  if(k=="k")note(P[Math.random()*5|0],t,.08,"sine",.04);
  else if(k=="c")note(12,t,.06,"sine",.03);
  else if(k=="o")[7,12,16].forEach((n,i)=>note(n,t+i*.07,.18,"triangle",.05));
  else if(k=="e"){note(-7,t,.2,"sine",.08);note(-10,t+.1,.25,"sine",.08)}
  else if(k=="r"){note(7,t,.16,"sine",.05);note(12,t+.1,.22,"sine",.05)}
  else[0,4,7,12].forEach((n,i)=>note(n,t+i*.1,.4,"triangle",.05));
}
